  <style>
    .category-header {
      background: linear-gradient(135deg, #c82333 0%, #e74c3c 100%);
      color: white;
      padding: 40px 0;
      margin-bottom: 40px;
    }

    .category-header h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .category-header p {
      font-size: 16px;
      opacity: 0.95;
    }

    .back-button {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin-bottom: 20px;
      transition: opacity 0.3s ease;
    }

    .back-button:hover {
      opacity: 0.8;
      color: white;
    }

    .bike-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      height: 100%;
    }

    .bike-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .bike-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: #f5f5f5;
    }

    .bike-info {
      padding: 20px;
    }

    .bike-name {
      font-size: 18px;
      font-weight: 600;
      color: #212529;
      margin-bottom: 8px;
    }

    .bike-description {
      font-size: 14px;
      color: #6c757d;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .bike-features {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .feature-tag {
      background: #f0f0f0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: #666;
    }

    .bike-specs {
      font-size: 13px;
      color: #999;
      line-height: 1.6;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }

    .bike-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bike-price {
      font-size: 16px;
      font-weight: 600;
      color: #c82333;
    }

    .bike-btn {
      background: #c82333;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .bike-btn:hover {
      background: #a01b28;
    }

    .bikes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    @media (max-width: 767px) {
      .bikes-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      .category-header h1 {
        font-size: 28px;
      }

      .category-header p {
        font-size: 14px;
      }
    }

    .no-bikes {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .no-bikes i {
      font-size: 48px;
      margin-bottom: 20px;
      opacity: 0.5;
    }
  </style>

    function renderBikes() {
      const categoryId = sessionStorage.getItem('selectedCategory') || 'xe-ga';
      const categoryData = bikeCategories[categoryId];

      if (!categoryData) {
        showNoBikes();
        return;
      }

      // Update header
      document.getElementById('categoryTitle').textContent = categoryData.name;
      document.getElementById('categoryDesc').textContent = categoryData.desc;

      // Render bikes
      const container = document.getElementById('bikesContainer');
      container.innerHTML = categoryData.bikes.map(bike => `
        <div class="bike-card" onclick="viewBikeDetail(${bike.id}, '${categoryId}')">
          <img src="${bike.image}" alt="${bike.name}" class="bike-image" onerror="this.src='assets/img/banner.jpg'">
          <div class="bike-info">
            <div class="bike-name">${bike.name}</div>
            <div class="bike-description">${bike.desc}</div>
            <div class="bike-features">
              ${bike.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
            </div>
            <div class="bike-specs">
              <div><strong>Dung tích:</strong> ${bike.cc}</div>
              <div><strong>Công suất:</strong> ${bike.power}</div>
            </div>
            <div class="bike-footer">
              <div class="bike-price">${bike.price}</div>
              <button class="bike-btn" onclick="event.stopPropagation(); addToBike(${bike.id}, '${bike.name}')">
                <i class="fa-solid fa-plus me-1"></i>VIEWxe
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function showNoBikes() {
      const container = document.getElementById('bikesContainer');
      container.innerHTML = `
        <div class="no-bikes" style="grid-column: 1 / -1;">
          <i class="fa-solid fa-motorcycle"></i>
          <h3>Không có xe nào</h3>
          <p>Danh mục này hiện chưa có xe.</p>
          <a href="sanpham.html" class="btn btn-primary mt-3">Quay lại sản phẩm</a>
        </div>
      `;
    }

    function viewBikeDetail(bikeId, categoryId) {
      // Chuyển đến trang chi tiết sản phẩm với thông tin xe
      const categoryData = bikeCategories[categoryId];
      const bike = categoryData.bikes.find(b => b.id === bikeId);

      if (bike) {
        // Lưu thông tin xe vào sessionStorage để trang chi tiết sử dụng
        sessionStorage.setItem('selectedBikeDetail', JSON.stringify(bike));
        sessionStorage.setItem('selectedCategory', categoryId);

        const bikeName = bike.name.toLowerCase();
        const productKey = bikeName.includes('vision')
          ? 'vision'
          : bikeName.includes('janus') || bikeName.includes('jannus')
            ? 'janus'
            : bikeName.includes('address') || bikeName.includes('suzuki')
              ? 'address'
              : bikeName.includes('grande')
                ? 'grande'
                : bikeName.includes('ct125') || bikeName.includes('ct 125')
                  ? 'ct125'
                  : bikeName.includes('wave')
                    ? 'wave'
                    : bikeName.includes('winner')
                      ? 'winnerr'
                      : bikeName.includes('cbr150r') || bikeName.includes('cbr150') || bikeName.includes('cbr 150')
                        ? 'cbr150r'
                        : bikeName.includes('yzf-r15') || bikeName.includes('yzfr15') || bikeName.includes('r15')
                          ? 'yzfr15'
                          : bikeName.includes('rebel')
                            ? 'rebel1100'
                            : bikeName.includes('nx500') || bikeName.includes('nx 500')
                              ? 'nx500'
                              : bikeName.includes('vinfast') || bikeName.includes('evo')
                                ? 'vinevo'
                                : bikeName.includes('feliz')
                                  ? 'feliz'
              : 'airblade';

        // Chuyển đến trang chi tiết sản phẩm
        window.location.href = `chi-tiet-san-pham.html?bike=${productKey}`;
      }
    }

    function addToBike(bikeId, bikeName) {
      // Thêm xe vào danh sách quản lý
      alert(`Đã thêm ${bikeName} vào danh sách quản lý!`);
      // Có thể redirect đến tasks.html với xe đã chọn
      sessionStorage.setItem('selectedBike', bikeId);
      window.location.href = 'tasks.html';
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      if (document.body.classList.contains('bg-dark') || localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('bg-dark', 'text-white');
      }
      updateNavbar();
      renderBikes();
    });
