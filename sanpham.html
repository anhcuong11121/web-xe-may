<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>motor chất - Sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .category-card {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      background: #fff;
      border: 1px solid #e0e0e0;
    }

    .category-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }

    .category-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .category-card:hover img {
      transform: scale(1.05);
    }

    .category-info {
      padding: 20px 16px;
      text-align: center;
      background: #f8f9fa;
    }

    .category-info h5 {
      font-weight: 600;
      color: #212529;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .category-info p {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .category-link {
      display: inline-block;
      color: #c82333;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .category-link:hover {
      color: #a01b28;
    }

    .category-arrow {
      margin-left: 8px;
      transition: transform 0.3s ease;
    }

    .category-card:hover .category-arrow {
      transform: translateX(4px);
    }

    .products-hero {
      width: 100%;
      overflow: hidden;
      background: #171a1b;
    }

    .products-hero img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .products-grid {
      padding: 60px 0;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      padding: 0;
    }

    @media (min-width: 992px) {
      .category-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 767px) {
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      .products-hero img {
        min-height: 180px;
        object-position: center;
      }
    }

    .filter-section {
      padding: 20px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .filter-btn {
      margin: 4px;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      border: 1px solid #ddd;
      background: #fff;
      color: #212529;
      transition: all 0.3s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #c82333;
      color: white;
      border-color: #c82333;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">motor <span class="brand-highlight">chất</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link active" href="sanpham.html">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="tasks.html">Quản lý xe</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Thống kê</a></li>
          <li class="nav-item"><a class="nav-link" href="lienhe.html">Liên hệ</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Đăng nhập</a></li>
          <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
            <button class="btn btn-outline-light dark-toggle" onclick="toggleDarkMode()"><i class="fa-solid fa-moon"></i></button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="products-hero">
    <img src="assets/img/banner-3.jpg" alt="Banner sản phẩm xe máy" />
  </section>

  <main class="container">
    <section class="products-grid">
      <div class="mb-4">
        <h3 class="mb-3">Chọn loại xe</h3>
        <div class="filter-section">
          <button class="filter-btn active" onclick="filterByType('')"><i class="fa-solid fa-list me-2"></i>Tất cả</button>
          <button class="filter-btn" onclick="filterByType('xe-ga')"><i class="fa-solid fa-circle me-2"></i>Xe Ga</button>
          <button class="filter-btn" onclick="filterByType('xe-so')"><i class="fa-solid fa-circle me-2"></i>Xe Số</button>
          <button class="filter-btn" onclick="filterByType('xe-con-tay')"><i class="fa-solid fa-fire me-2"></i>Xe Côn Tay</button>
          <button class="filter-btn" onclick="filterByType('xe-pkl')"><i class="fa-solid fa-arrows me-2"></i>Xe PKL</button>
          <button class="filter-btn" onclick="filterByType('xe-dien')"><i class="fa-solid fa-plug me-2"></i>Xe Điện</button>
        </div>
      </div>

      <div class="category-grid" id="categoriesContainer">
        <!-- Các loại xe sẽ được render ở đây -->
      </div>
    </section>
  </main>

  <footer class="py-4">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 motor chất. Điện thoại: 0987888888 | Email: motorchat@gmail.com</p>
      <small>Được phát triển bởi Lê Cương, Minh Đức.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="assets/js/apiClient.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // Data sản phẩm theo loại xe
    const productCategories = [
      {
        id: 'xe-ga',
        name: 'Xe Ga',
        description: 'Thoải mái, an toàn cho chạy phố',
        image: 'assets/img/xe-ga.png',
        icon: '<i class="fa-solid fa-person-hiking"></i>'
      },
      {
        id: 'xe-so',
        name: 'Xe Số',
        description: 'Độc đáo, linh hoạt, tiết kiệm xăng',
        image: 'assets/img/xe-so.png',
        icon: '<i class="fa-solid fa-motorcycle"></i>'
      },
      {
        id: 'xe-con-tay',
        name: 'Xe Côn Tay',
        description: 'Mạnh mẽ, thể thao, dễ điều khiển',
        image: 'assets/img/xe-con-tay.png',
        icon: '<i class="fa-solid fa-fire"></i>'
      },
      {
        id: 'xe-pkl',
        name: 'Xe PKL',
        description: 'Đa dụng, tiện lợi cho công việc',
        image: 'assets/img/xe-pkl.png',
        icon: '<i class="fa-solid fa-truck"></i>'
      },
      {
        id: 'xe-dien',
        name: 'Xe Điện',
        description: 'Thân thiện môi trường, hiện đại',
        image: 'assets/img/xe-dien.png',
        icon: '<i class="fa-solid fa-plug"></i>'
      }
    ];

    let currentFilter = '';

    function renderCategories(filter = '') {
      const container = document.getElementById('categoriesContainer');
      const filtered = filter ? productCategories.filter(cat => cat.id === filter) : productCategories;

      container.innerHTML = filtered.map(category => `
        <div class="category-card" onclick="goToProductDetail('${category.id}')">
          <img src="${category.image}" alt="${category.name}" onerror="this.src='assets/img/banner.jpg'">
          <div class="category-info">
            <h5>${category.name}</h5>
            <p>${category.description}</p>
            <a href="#" class="category-link">Xem thêm<span class="category-arrow"><i class="fa-solid fa-arrow-right"></i></span></a>
          </div>
        </div>
      `).join('');
    }

    function filterByType(type) {
      currentFilter = type;
      
      // Update button states
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.closest('button').classList.add('active');

      renderCategories(type);
    }

    function goToProductDetail(categoryId) {
      // Lưu loại xe được chọn vào sessionStorage
      sessionStorage.setItem('selectedCategory', categoryId);
      window.location.href = 'chi-tiet-xe.html';
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      if (document.body.classList.contains('bg-dark') || localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('bg-dark', 'text-white');
      }
      updateNavbar();
      renderCategories();
    });
  </script>
</body>
</html>
